<!DOCTYPE html>
<html lang="ar">

<head>
    <meta charset="UTF-8">
    <title>انضم إلينا - معهد راية</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>

<body class="bg-cover bg-center min-h-screen flex items-center justify-center" style="background-image: url('main2.jpg'); direction: rtl;">

    <div class="bg-white bg-opacity-90 p-8 rounded-xl shadow-lg w-full max-w-md text-center">
        <h1 class="text-2xl font-bold mb-6">✍️ إنشاء حساب جديد</h1>

        <input type="text" id="name" placeholder="الاسم الكامل" class="mb-4 w-full p-3 rounded border" />
        <input type="email" id="email" placeholder="البريد الإلكتروني" class="mb-4 w-full p-3 rounded border" />
        <input type="password" id="password" placeholder="كلمة المرور" class="mb-4 w-full p-3 rounded border" />

        <button onclick="signup()" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded w-full">
      إنشاء الحساب
    </button>

        <p class="mt-4 text-sm">هل لديك حساب بالفعل؟
            <a href="login.html" class="text-blue-700 font-semibold hover:underline">تسجيل الدخول</a>
        </p>
    </div>


    <!-- Firebase Scripts (مُحدثة بشكل صحيح) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js"; import { getAuth, createUserWithEmailAndPassword, sendEmailVerification } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js"; const firebaseConfig
        = { apiKey: "AIzaSyD0IAstH4zer5RkzJuQhPALX0UVnPotPDA", authDomain: "raya-ahmed.firebaseapp.com", projectId: "raya-ahmed", storageBucket: "raya-ahmed.appspot.com", messagingSenderId: "408257613174", appId: "1:408257613174:web:57a6e4631b9866416cfe57"
        }; const app = initializeApp(firebaseConfig); const auth = getAuth(app); window.signup = () => { const email = document.getElementById("email").value.trim(); const password = document.getElementById("password").value; createUserWithEmailAndPassword(auth,
        email, password) .then((userCredential) => { const user = userCredential.user; sendEmailVerification(user).then(() => { alert("📩 تم إرسال رابط التحقق إلى بريدك الإلكتروني."); window.location.href = "verify-email.html"; }); }) .catch((error) =>
        { alert("❌ " + error.message); }); };
    </script>

</body>

</html>
