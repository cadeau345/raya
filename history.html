<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <title>سجل الحضور - معهد راية</title>


    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="style.css" />
    <style>
        body {
            background-color: #f1f5f9;
            font-family: 'Tajawal', sans-serif;
            margin: 0;
            padding: 0;
        }
        
        .container {
            max-width: 700px;
            margin: 60px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        
        h1 {
            margin-bottom: 30px;
            font-size: 26px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 30px;
        }
        
        th,
        td {
            padding: 15px;
            border-bottom: 1px solid #eee;
            font-size: 16px;
        }
        
        th {
            background-color: #f0f0f0;
        }
        
        .btn {
            background-color: #1e90ff;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            text-decoration: none;
        }
        
        .btn:hover {
            background-color: #007acc;
        }
        
        .empty-message {
            color: #999;
            font-size: 17px;
            margin-top: 20px;
        }
    </style>
</head>

    </div>
