    <script>
        function logout() {
            firebase.auth().signOut()
                .then(() => {
                    window.location.href = "login.html";

                .catch((error) => {
                    alert("حدث خطأ أثناء تسجيل الخروج: " + error.message);
                });
        }
    </script>
    <!-- مكتبات Firebase -->
