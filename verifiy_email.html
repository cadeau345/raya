<!DOCTYPE html>
<html lang="ar">

<head>
    <meta charset="UTF-8">
    <title>تأكيد البريد - معهد راية</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>

<body class="bg-blue-100 flex items-center justify-center min-h-screen" style="direction: rtl;">

    <div class="bg-white p-8 rounded-xl shadow-lg text-center max-w-md w-full">
        <h1 class="text-2xl font-bold text-green-700 mb-4">📩 تم إرسال رابط التفعيل</h1>
        <p class="mb-6 text-gray-700">لقد أرسلنا رابط تفعيل إلى بريدك الإلكتروني. يرجى التحقق من صندوق البريد (أو البريد غير الهام).</p>

        <button onclick="resendVerification()" class="bg-yellow-500 hover:bg-yellow-600 text-white font-bold py-2 px-4 rounded w-full mb-4">
      🔁 إعادة إرسال رابط التفعيل
    </button>

        <button onclick="goToLogin()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded w-full">
      🔐 تسجيل الدخول
    </button>
    </div>

    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyD0IAstH4zer5RkzJuQhPALX0UVnPotPDA",
            authDomain: "raya-ahmed.firebaseapp.com",
            projectId: "raya-ahmed",
            storageBucket: "raya-ahmed.appspot.com",
            messagingSenderId: "408257613174",
            appId: "1:408257613174:web:57a6e4631b9866416cfe57",
            measurementId: "G-D5YG680EKX"
        };

        firebase.initializeApp(firebaseConfig);

        function resendVerification() {
            const email = localStorage.getItem("registeredEmail");
            const password = localStorage.getItem("registeredPassword");

            if (!email || !password) {
                alert("❌ لم يتم العثور على البريد أو كلمة المرور. الرجاء التسجيل مرة أخرى.");
                return;
            }

            firebase.auth().signInWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    const user = userCredential.user;

                    if (user.emailVerified) {
                        alert("✅ بريدك مفعل بالفعل. يمكنك تسجيل الدخول الآن.");
                    } else {
                        user.sendEmailVerification()
                            .then(() => {
                                alert("📨 تم إرسال رابط تفعيل جديد إلى بريدك.");
                            })
                            .catch((error) => {
                                alert("❌ خطأ في إرسال التفعيل: " + error.message);
                            });
                    }
                })
                .catch((error) => {
                    alert("❌ خطأ في تسجيل الدخول المؤقت: " + error.message);
                });
        }

        function goToLogin() {
            window.location.href = "login.html";
        }
    </script>
</body>

</html>
